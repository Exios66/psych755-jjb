# Default paths prefer private full-cohort exports beside the repo:
#   ../sibling_data/PRCAProlificExport_FileA.csv
#   ../sibling_data/PRCAProlificExport_FileB.csv
#   ../sibling_data/PRCAQualtricsExport_FileC.csv
# When those files are absent, library helpers may fall back to
# data/excerpts/ fixtures for unit tests / offline CI only.
# Posit Connect Cloud renders use sibling File A/B/C when staged, otherwise
# committed artifacts under artifacts/posit_full_cohort/ (never excerpts).

paths:
  prolific_files:
    - ../sibling_data/PRCAProlificExport_FileA.csv
    - ../sibling_data/PRCAProlificExport_FileB.csv
  qualtrics: ../sibling_data/PRCAQualtricsExport_FileC.csv

# Cumulative information tiers mapped to the research questions:
#   demos      → baseline demographics (Age, Sex, country, student status;
#                optional ethnicity/nationality/language when the Prolific
#                export includes them)
#   employment → RQ1: does employment improve prediction / change bias?
#   geo        → approximate survey lat/long context
#   transit    → RQ2: full transportation-use signal (includes demos+employment+geo)
#   full       → all of the above + open-text attitudes (Q18.1 / Q19)  [RQ3]
#   v3_*       → evidence-based ablations (rideshare-only, public-transit-only, voice)
tiers:
  - demos
  - employment
  - geo
  - transit
  - full
  - v3_rideshare
  - v3_public_transit
  - v3_voice

llm:
  # Prefer mock for reproducible dry-runs; pass --provider ollama|openrouter for live LLM.
  provider: mock
  temperature: 0.2
  max_tokens: 256
  timeout_seconds: 120

scoring:
  # McCroskey PRCA subscale bands commonly used in classroom settings
  band_low_max: 13
  band_high_min: 20

# Applied by run/prepare when cleaning is enabled (see pipeline.py).
# CLI --join remains authoritative for the join strategy.
cleaning:
  require_complete_ca: true
