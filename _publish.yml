# Posit Connect Cloud publish targets
#
# == Auto-deploy (no GitHub Actions needed) ==
# Posit Connect Cloud has built-in Git-backed deployment:
# 1. Push to GitHub (any branch)
# 2. Posit checks the repo every 15 min
# 3. Auto-deploys on new commits
#
# To configure: go to connect.posit.cloud → Publish → Import from Git
#   URL: https://github.com/Exios66/psych755-jjb
#   Branch: main
#   Directory: / (root — manifest.json needed)
#   Content ID: 019f9a10-ebb9-d1d5-839f-97e794bfd0ca
#
# == Manual publish (from CLI) ==
#   1. Render:  quarto render
#   2. Publish: python scripts/posit_publish.py
#
# First time: OAuth device flow (opens a URL in your browser)
# After that: Set POSIT_CONNECT_CLOUD_ACCESS_TOKEN in .env to skip OAuth
#   Token: generate at https://connect.posit.cloud/jackjburleson → Profile → API Keys

- source: project
  posit-connect-cloud:
