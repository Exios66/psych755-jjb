crossref:
  fig-title: "Figure"
  tbl-title: "Table"
  title-delim: "."

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    toc-depth: 3
    toc-location: right
    number-sections: true
    code-fold: true
    code-tools: true
    code-link: true
    df-print: paged
    link-external-newwindow: true
    smooth-scroll: true
    citations-hover: true
    footnotes-hover: true
    fig-cap-location: bottom
    tbl-cap-location: top

execute:
  echo: true
  warning: false
  message: false
  freeze: auto

bibliography: references.bib
csl: https://www.zotero.org/styles/apa
